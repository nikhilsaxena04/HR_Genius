<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="toolbar">
        <div>
            <h2>Apply for Leave</h2>
            <p style="color: var(--muted); font-size: 13px;">
                You currently have <strong th:text="${remainingLeaves}">12</strong> day(s) of remaining leave this year.
            </p>
        </div>
        <a th:href="@{/leaves}" class="btn btn-secondary">&larr; Back to Leaves</a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card" style="max-width: 580px;">
        <form th:action="@{/leaves/apply}" th:object="${leaveRequest}" method="post">
            <div class="form-group">
                <label for="type">Leave Type <span style="color: var(--badge-red-text);">*</span></label>
                <select id="type" th:field="*{type}">
                    <option th:each="t : ${leaveTypes}"
                            th:value="${t}"
                            th:text="${t}">CASUAL</option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">Type error</div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label for="fromDate">From Date <span style="color: var(--badge-red-text);">*</span></label>
                    <input type="date" id="fromDate" th:field="*{fromDate}" required>
                    <div class="field-error" th:if="${#fields.hasErrors('fromDate')}" th:errors="*{fromDate}">Date error</div>
                </div>

                <div class="form-group">
                    <label for="toDate">To Date <span style="color: var(--badge-red-text);">*</span></label>
                    <input type="date" id="toDate" th:field="*{toDate}" required>
                    <div class="field-error" th:if="${#fields.hasErrors('toDate')}" th:errors="*{toDate}">Date error</div>
                </div>
            </div>

            <div class="form-group">
                <label for="reason">Reason for Leave <span style="color: var(--badge-red-text);">*</span></label>
                <textarea id="reason" th:field="*{reason}" rows="4" placeholder="Briefly describe the reason for your leave request..." required></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}">Reason error</div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary">Submit Application</button>
                <a th:href="@{/leaves}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
