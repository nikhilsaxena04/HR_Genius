<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${status} + ' Error — HRGenius'">Error — HRGenius</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
    <div class="login-card" style="text-align: center; max-width: 440px;">
        <div style="font-size: 56px; font-weight: 700; letter-spacing: -2px; color: var(--text); line-height: 1; margin-bottom: 12px;"
             th:text="${status}">404</div>

        <h2 style="font-size: 18px; margin-bottom: 8px;">
            <span th:if="${status == 403}">Access Denied</span>
            <span th:if="${status == 404}">Page Not Found</span>
            <span th:if="${status == 500}">Server Error</span>
            <span th:if="${status != 403 && status != 404 && status != 500}">Error Encountered</span>
        </h2>

        <p style="color: var(--muted); font-size: 13px; line-height: 1.5; margin-bottom: 24px;"
           th:text="${message}">
            You do not have permission to access this resource.
        </p>

        <div style="display: flex; gap: 12px; justify-content: center;">
            <a th:href="@{/dashboard}" class="btn btn-primary">Return to Dashboard</a>
            <a th:href="@{/login}" class="btn btn-secondary">Login Page</a>
        </div>
    </div>
</body>
</html>
