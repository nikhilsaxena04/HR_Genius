<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="toolbar">
        <div>
            <h2 th:text="${title}">Department Form</h2>
            <p style="color: var(--muted); font-size: 13px;">Enter the department name below</p>
        </div>
        <a th:href="@{/departments}" class="btn btn-secondary">&larr; Back to List</a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card" style="max-width: 540px;">
        <form th:action="@{/departments/save}" th:object="${department}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="name">Department Name <span style="color: var(--badge-red-text);">*</span></label>
                <input type="text" id="name" th:field="*{name}" placeholder="e.g. Quality Assurance" autofocus>
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary">Save Department</button>
                <a th:href="@{/departments}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
