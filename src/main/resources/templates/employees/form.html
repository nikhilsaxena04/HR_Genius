<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="toolbar">
        <div>
            <h2 th:text="${title}">Employee Form</h2>
            <p style="color: var(--muted); font-size: 13px;">Fill in the profile details below</p>
        </div>
        <a th:href="@{/employees}" class="btn btn-secondary">&larr; Back to List</a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card" style="max-width: 680px;">
        <form th:action="@{/employees/save}" th:object="${employee}" method="post">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{empCode}">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group" style="grid-column: span 2;">
                    <label for="fullName">Full Name <span style="color: var(--badge-red-text);">*</span></label>
                    <input type="text" id="fullName" th:field="*{fullName}" placeholder="e.g. John Doe" autofocus>
                    <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Full name error</div>
                </div>

                <div class="form-group">
                    <label for="email">Work Email <span style="color: var(--badge-red-text);">*</span></label>
                    <input type="email" id="email" th:field="*{email}" placeholder="john.doe@hrgenius.com"
                           th:readonly="${employee.id != null}">
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
                    <small th:if="${employee.id == null}" style="color: var(--muted); font-size: 11px;">
                        A login account will be automatically provisioned with default password <code>Welcome@123</code>.
                    </small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" th:field="*{phone}" placeholder="+1 234 567 8900">
                    <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</div>
                </div>

                <div class="form-group">
                    <label for="department">Department <span style="color: var(--badge-red-text);">*</span></label>
                    <select id="department" th:field="*{department}">
                        <option value="">Select Department</option>
                        <option th:each="dept : ${departments}"
                                th:value="${dept.id}"
                                th:text="${dept.name}">Engineering</option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}">Department error</div>
                </div>

                <div class="form-group">
                    <label for="designation">Designation</label>
                    <input type="text" id="designation" th:field="*{designation}" placeholder="e.g. Software Engineer">
                    <div class="field-error" th:if="${#fields.hasErrors('designation')}" th:errors="*{designation}">Designation error</div>
                </div>

                <div class="form-group">
                    <label for="joinDate">Joining Date <span style="color: var(--badge-red-text);">*</span></label>
                    <input type="date" id="joinDate" th:field="*{joinDate}">
                    <div class="field-error" th:if="${#fields.hasErrors('joinDate')}" th:errors="*{joinDate}">Date error</div>
                </div>

                <div class="form-group">
                    <label for="basicSalary">Basic Salary (USD) <span style="color: var(--badge-red-text);">*</span></label>
                    <input type="number" step="0.01" id="basicSalary" th:field="*{basicSalary}" placeholder="50000.00">
                    <div class="field-error" th:if="${#fields.hasErrors('basicSalary')}" th:errors="*{basicSalary}">Salary error</div>
                </div>

                <div class="form-group" th:if="${employee.id != null}">
                    <label for="status">Employment Status</label>
                    <select id="status" th:field="*{status}">
                        <option th:each="st : ${T(com.hrgenius.model.EmployeeStatus).values()}"
                                th:value="${st}"
                                th:text="${st}">ACTIVE</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary">Save Employee</button>
                <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
