# ============================================================
# HRGenius — Application Properties (H2 File Mode)
# ============================================================

spring.application.name=HRGenius

# H2 Database in FILE mode so data persists between restarts
spring.datasource.url=jdbc:h2:file:./data/hrgenius;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate — auto-create and update tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# H2 Console (handy for debugging during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf — disable cache during development
spring.thymeleaf.cache=false

# Server
server.port=${PORT:8080}
server.error.whitelabel.enabled=false
